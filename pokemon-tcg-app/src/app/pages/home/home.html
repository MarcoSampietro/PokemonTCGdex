<h1 class="mb-3">Carte Pokémon</h1>

<!-- FILTRI -->
<div class="card mb-3">
  <div class="card-body">
    <form class="row g-3">

      <!-- Nome -->
      <div class="col-md-4">
        <label class="form-label">Nome</label>
        <input type="text"
               class="form-control"
               [(ngModel)]="searchTerm"
               name="searchTerm"
               (ngModelChange)="onSearchChange()"
               placeholder="Es. Pikachu" />
      </div>

      <!-- Tipo -->
      <div class="col-md-2">
        <label class="form-label">Tipo</label>
        <select class="form-select"
                [(ngModel)]="selectedType"
                name="selectedType"
                (change)="onFilterChange()">
          <option value="">Tutti</option>
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <!-- Rarità -->
      <div class="col-md-2">
        <label class="form-label">Rarità</label>
        <select class="form-select"
                [(ngModel)]="selectedRarity"
                name="selectedRarity"
                (change)="onFilterChange()">
          <option value="">Tutte</option>
          <option *ngFor="let r of rarities" [value]="r">{{ r }}</option>
        </select>
      </div>

      <!-- Set -->
      <div class="col-md-3">
        <label class="form-label">Set</label>
        <select class="form-select"
                [(ngModel)]="selectedSet"
                name="selectedSet"
                (change)="onFilterChange()">

          <option value="">Tutti</option>

          <option *ngFor="let s of sets"
                  [value]="s.id">
            {{ s.name }}
          </option>

        </select>
      </div>

    </form>
  </div>
</div>

<!-- LOADING -->
<div *ngIf="loading" class="text-center mt-4">
  <div class="spinner-border"></div>
  <p>Caricamento carte...</p>
</div>

<!-- ERROR -->
<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<!-- CARDS -->
<div class="row row-cols-2 row-cols-md-6 g-3" *ngIf="!loading && !error">

  <div class="col" *ngFor="let card of cards">
    <div class="card h-100 shadow-sm">

      <img class="card-img-top"
           [src]="getImageUrl(card)"
           (error)="onImgError($event)"
           [alt]="card.name" />

      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ card.name }}</h5>
        <p><strong>Set:</strong> {{ card.set?.name }}</p>
        <p><strong>Tipo:</strong> {{ card.types?.join(', ') }}</p>
        <p><strong>Rarità:</strong> {{ card.rarity }}</p>

        <div class="mt-auto d-flex justify-content-between">
          <a class="btn btn-sm btn-primary"
             [routerLink]="['/card', card.id]">Dettagli</a>

          <button class="btn btn-sm"
                  [ngClass]="isFavorite(card) ? 'btn-warning' : 'btn-outline-warning'"
                  (click)="toggleFavorite(card, $event)">
            ★
          </button>
        </div>

      </div>
    </div>
  </div>

</div>

<!-- PAGINAZIONE -->
<div class="d-flex justify-content-center align-items-center mt-4">
  <button class="btn btn-secondary me-3"
          (click)="prevPage()"
          [disabled]="currentPage === 1">« Precedente</button>

  <span class="mx-2">Pagina {{ currentPage }}</span>

  <button class="btn btn-secondary ms-3"
          (click)="nextPage()">Successiva »</button>
</div>

<h1 class="mb-3">Cerca carte Pokémon</h1>

<div class="card mb-3">
  <div class="card-body">
    <form class="row g-2">
      <div class="col-md-4">
        <label class="form-label">Nome</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="searchTerm"
          name="searchTerm"
          (ngModelChange)="onSearchChange()"
          placeholder="Es. Charizard"
        />
      </div>

      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select
          class="form-select"
          [(ngModel)]="selectedType"
          name="selectedType"
          (change)="onFilterChange()"
        >
          <option value="">Tutti</option>
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Rarità</label>
        <select
          class="form-select"
          [(ngModel)]="selectedRarity"
          name="selectedRarity"
          (change)="onFilterChange()"
        >
          <option value="">Tutte</option>
          <option *ngFor="let r of rarities" [value]="r">{{ r }}</option>
        </select>
      </div>
    </form>
  </div>
</div>

<div *ngIf="loading" class="text-center mt-4">
  <div class="spinner-border" role="status"></div>
  <p class="mt-2">Caricamento carte...</p>
</div>

<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<div class="row row-cols-1 row-cols-md-3 g-3" *ngIf="!loading && !error">
  <div class="col" *ngFor="let card of filteredCards">
    <div class="card h-100 shadow-sm">
      <img [src]="card.image + '/high.webp'" class="card-img-top" [alt]="card.name" />

      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ card.name }}</h5>
        <p class="card-text mb-1">
          <strong>Set:</strong> {{ card.set?.name || card.set?.id }}
        </p>
        <p class="card-text mb-1" *ngIf="card.types?.length">
          <strong>Tipo:</strong> {{ card.types?.join(', ') }}
        </p>
        <p class="card-text mb-1" *ngIf="card.rarity">
          <strong>Rarità:</strong> {{ card.rarity }}
        </p>

        <div class="mt-auto d-flex justify-content-between align-items-center">
          <a [routerLink]="['/card', card.id]" class="btn btn-sm btn-primary">
            Dettagli
          </a>

          <button
            type="button"
            class="btn btn-sm"
            [ngClass]="isFavorite(card) ? 'btn-warning' : 'btn-outline-warning'"
            (click)="toggleFavorite(card, $event)"
          >
            <i class="bi" [ngClass]="isFavorite(card) ? 'bi-star-fill' : 'bi-star'"></i>
            Preferito
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
